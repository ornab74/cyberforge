name: CyberForge CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sidecar/requirements-dev.txt
      - run: python -m pip install -r sidecar/requirements-dev.txt
      - run: PYTHONPATH=sidecar python -m compileall -q sidecar/cyberforge_sidecar
      - run: PYTHONPATH=sidecar CYBERFORGE_DATA_DIR=/tmp/cyberforge-ci python -m pytest -q sidecar/tests

  flutter-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
