services:
  cyberforge-sidecar:
    build:
      context: ./sidecar
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      CYBERFORGE_BIND: 0.0.0.0
      CYBERFORGE_DATA_DIR: /data
      CYBERFORGE_ALLOW_REMOTE_BIND: "true"
      CYBERFORGE_WEAVIATE_MODE: remote
      CYBERFORGE_WEAVIATE_HTTP_HOST: weaviate
      CYBERFORGE_WEAVIATE_HTTP_PORT: 8080
      CYBERFORGE_WEAVIATE_GRPC_HOST: weaviate
      CYBERFORGE_WEAVIATE_GRPC_PORT: 50051
      CYBERFORGE_WEAVIATE_SECURE: "false"
      CYBERFORGE_WEAVIATE_COLLECTION: CyberForgeMemoryV1
    depends_on:
      weaviate:
        condition: service_healthy
    volumes:
      - cyberforge-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.37.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: "50"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: cyberforge-memory
      DISABLE_TELEMETRY: "true"
      LOG_LEVEL: warning
    volumes:
      - cyberforge-weaviate:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  cyberforge-data:
  cyberforge-weaviate:
