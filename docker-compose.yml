services:
  cyberforge-sidecar:
    build:
      context: ./sidecar
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      CYBERFORGE_BIND: 0.0.0.0
      CYBERFORGE_DATA_DIR: /data
      CYBERFORGE_ALLOW_REMOTE_BIND: "true"
    volumes:
      - cyberforge-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  cyberforge-data:
