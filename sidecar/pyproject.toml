[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberforge-sidecar"
version = "0.3.0"
description = "Local-first blue-team simulation, encrypted model runtime, and defensive model council."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "cryptography>=45,<47",
  "argon2-cffi>=25,<26",
  "numpy>=2.2,<3",
]

[project.optional-dependencies]
local-models = ["llama-cpp-python>=0.3.16,<0.4", "litert-lm==0.11.0"]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[project.scripts]
cyberforge-sidecar = "cyberforge_sidecar.__main__:main"
cyberforgectl = "cyberforge_sidecar.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cyberforge_sidecar*"]

[tool.ruff]
line-length = 100
target-version = "py311"
